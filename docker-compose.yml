services:
  api:
    build: .
    image: ashcombe-rowe-api:latest  
    container_name: ashcombe_rowe_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
      - ./transcripts:/app/transcripts

  ui:
    image: ashcombe-rowe-api:latest
    container_name: ashcombe_rowe_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    volumes:
      - ./transcripts:/app/transcripts
